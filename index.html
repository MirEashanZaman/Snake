<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
  <title>Snake</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="snake.css" />
</head>

<body>
  <main class="device">
    <div class="device__brand">NOKIA</div>

    <div class="screen">
      <div class="screen__hud">
        <div class="hud__cell">
          <span class="hud__label">SCORE</span>
          <span class="hud__value" id="score">0</span>
        </div>
        <div class="hud__cell hud__cell--center">
          <span class="hud__label">LEVEL</span>
          <span class="hud__value hud__value--small" id="levelName">EASY</span>
        </div>
        <div class="hud__cell hud__cell--right">
          <span class="hud__label">BEST</span>
          <span class="hud__value" id="best">0</span>
        </div>
      </div>

      <div class="screen__board">
        <canvas id="board" width="320" height="320"></canvas>
        <div class="overlay hidden" id="overlay"></div>
      </div>

      <div class="screen__footer">
        <span id="status">READY</span>
        <button class="sound-toggle" id="soundBtn" aria-label="Toggle sound" type="button">
          <span id="soundIcon">♪ ON</span>
        </button>
        <span class="footer__speed">SPD <span id="speed">1</span></span>
      </div>
    </div>

    <div class="controls">
      <div class="dpad" aria-label="Direction pad">
        <button class="dpad__btn dpad__btn--up" data-dir="up" aria-label="Up">▲</button>
        <button class="dpad__btn dpad__btn--left" data-dir="left" aria-label="Left">◀</button>
        <button class="dpad__btn dpad__btn--center" id="pauseBtn" aria-label="Pause">❚❚</button>
        <button class="dpad__btn dpad__btn--right" data-dir="right" aria-label="Right">▶</button>
        <button class="dpad__btn dpad__btn--down" data-dir="down" aria-label="Down">▼</button>
      </div>
    </div>

    <div class="device__label">SNAKE II</div>
  </main>

  <script src="snake.js"></script>
</body>

</html>
